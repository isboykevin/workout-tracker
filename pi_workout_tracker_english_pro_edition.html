<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PI Prep x Lean Legs | Workout Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0B1120',
              panel: '#1E293B',
              border: '#334155',
              accent: '#0EA5E9',
              accentGlow: 'rgba(14, 165, 233, 0.4)',
              exam: '#EF4444', // Red for PI Exam
              success: '#10B981',
              textMuted: '#94A3B8'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      background-color: #0B1120;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 120px;
      font-family: 'Inter', sans-serif;
    }

    /* Hide Scrollbar but keep functionality */
    ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glassmorphism Panels */
    .glass-panel {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    /* PI Exam Highlight */
    .exam-highlight {
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4) !important;
      background: linear-gradient(145deg, rgba(30,41,59,0.8) 0%, rgba(127,29,29,0.1) 100%);
    }

    /* Custom Checkbox */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border: 2px solid #475569;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .custom-checkbox:checked {
      background: #10B981;
      border-color: #10B981;
      transform: scale(1.05);
    }
    .custom-checkbox:checked::after {
      content: '✓';
      color: #0B1120;
      font-size: 16px;
      font-weight: 900;
    }

    /* Animations */
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Toast Notification */
    #toast {
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
      transform: translate(-50%, 150px);
      opacity: 0;
    }
    #toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    /* Custom Modal */
    #confirmModal {
      backdrop-filter: blur(5px);
      transition: opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    #confirmModal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #confirmModal.active .modal-content {
      transform: scale(1);
    }
  </style>
</head>
<body class="antialiased selection:bg-brand-accent selection:text-white">

      // Auto-select today
      const jsDay = new Date().getDay();
      currentDay = jsDay === 0 ? 7 : jsDay;
      
      renderDaySelector();
      selectDay(currentDay);
      updateTotalStats();
      loadHabits();

    function switchTab(tab) {
      const planView = document.getElementById('planView');
      const historyView = document.getElementById('historyView');
      const tabPlanBtn = document.getElementById('tabPlanBtn');
      const tabHistoryBtn = document.getElementById('tabHistoryBtn');

      if (tab === 'plan') {
        planView.classList.remove('hidden');
        historyView.classList.add('hidden');
        tabPlanBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-brand-accent text-brand-bg shadow-[0_0_20px_rgba(14,165,233,0.3)]";
        tabHistoryBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-slate-200 bg-transparent";
      } else {
        planView.classList.add('hidden');
        historyView.classList.remove('hidden');
        tabPlanBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-slate-200 bg-transparent";
        tabHistoryBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-brand-accent text-brand-bg shadow-[0_0_20px_rgba(14,165,233,0.3)]";
        renderHistoryLogs();
      }
    }

    function renderDaySelector() {
      const container = document.getElementById('daySelector');
      const daysInfo = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      
      let html = '';
      for (let i = 1; i <= 7; i++) {
        const isCore = [1, 3, 4, 5, 6].includes(i); // Core Days
        const isToday = i === currentDay;
        
        html += `
          <div onclick="selectDay(${i})" id="pill-${i}" 
               class="min-w-[64px] flex-1 py-2.5 px-1 rounded-2xl border border-brand-border cursor-pointer transition-all flex flex-col items-center justify-center relative
               ${isToday ? 'border-brand-success bg-brand-success/10' : 'glass-panel hover:bg-slate-800/50'}">
            ${isToday ? `<div class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-brand-success"></div>` : ''}
            <span class="text-xs font-bold text-slate-300 name-span mb-0.5">${daysInfo[i-1]}</span>
            ${isCore ? `<span class="text-[9px] text-brand-accent font-extrabold tracking-wide uppercase">Core</span>` : `<span class="text-[9px] text-slate-500 font-bold uppercase tracking-wide">Aux</span>`}
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function selectDay(dayNum) {
      currentDay = dayNum;
      
      // Update UI Pills visually
      for (let i = 1; i <= 7; i++) {
        const pill = document.getElementById(`pill-${i}`);
        if(pill) {
          if (i === dayNum) {
            pill.classList.add('bg-brand-accent', 'border-brand-accent');
            pill.classList.remove('glass-panel', 'bg-brand-success/10', 'hover:bg-slate-800/50');
            pill.querySelector('.name-span').classList.replace('text-slate-300', 'text-brand-bg');
            pill.querySelector('span:last-child').classList.replace('text-brand-accent', 'text-brand-bg');
            pill.querySelector('span:last-child').classList.replace('text-slate-500', 'text-brand-bg/70');
            pill.style.boxShadow = "0 4px 20px rgba(14,165,233,0.3)";
          } else {
            pill.classList.remove('bg-brand-accent', 'border-brand-accent');
            pill.classList.add('glass-panel');
            pill.querySelector('.name-span').classList.replace('text-brand-bg', 'text-slate-300');
            pill.querySelector('span:last-child').classList.replace('text-brand-bg', 'text-brand-accent');
            pill.querySelector('span:last-child').classList.replace('text-brand-bg/70', 'text-slate-500');
            pill.style.boxShadow = "none";
            
            // Re-apply today styling indicator
            const jsDay = new Date().getDay();
            const mappedDay = jsDay === 0 ? 7 : jsDay;
            if(i === mappedDay) pill.classList.add('border-brand-success', 'bg-brand-success/10');
          }
        }
      }

      renderDayPlan(dayNum);
      document.getElementById(`pill-${dayNum}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function renderDayPlan(dayNum) {
      const dayData = workoutSchedule[dayNum];
      const bannerEl = document.getElementById('dayBanner');
      const listEl = document.getElementById('exerciseList');

      // Render Banner
      bannerEl.innerHTML = `
        <div class="flex justify-between items-start mb-3 relative z-10">
          <h2 class="text-lg font-black text-white max-w-[70%] leading-tight">${dayData.title}</h2>
          <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-lg border ${dayData.typeTag}">${dayData.typeName}</span>
        </div>
        <p class="text-[13px] text-slate-300 mb-4 relative z-10 leading-relaxed font-medium">${dayData.desc}</p>
        <div class="text-xs font-bold text-brand-accent bg-slate-900/50 px-3.5 py-2.5 rounded-xl border border-brand-accent/20 relative z-10 inline-flex items-center gap-2">
          <span class="text-base">⚡</span> Warmup: ${dayData.warmup}
        </div>
      `;

      // Render Exercises
      listEl.innerHTML = dayData.exercises.map(ex => {
        const isExamFocus = ex.tags && ex.tags.includes('PI-Exam');
        const cardClass = isExamFocus ? "exam-highlight" : "border-brand-border/60";
        
        let tagHtml = '';
        if(ex.tags) {
          tagHtml = ex.tags.map(t => {
            if(t === 'PI-Exam') return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-brand-exam text-white uppercase tracking-wide">PI EXAM</span>`;
            return `<span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-slate-700 text-slate-300 uppercase tracking-wide">${t}</span>`;
          }).join('');
        }

        return `
        <div class="glass-panel rounded-2xl p-4 transition-all duration-300 border ${cardClass}" id="card-${ex.id}">
          <div class="flex items-start gap-3">
            <input type="checkbox" class="custom-checkbox mt-0.5" id="chk-${ex.id}" onchange="toggleCheck('${ex.id}', ${isExamFocus})">
            <div class="flex-1">
              <div class="flex justify-between items-start gap-2">
                <div class="text-[15px] font-extrabold text-white leading-tight" id="title-${ex.id}">${ex.name}</div>
                <div class="flex gap-1 flex-wrap justify-end shrink-0">${tagHtml}</div>
              </div>
              
              <div class="flex gap-2 mt-2.5 mb-3">
                <span class="text-[10px] font-bold px-2 py-1 rounded-lg bg-slate-900 border border-slate-700 text-brand-accent">🎯 ${ex.target}</span>
                <span class="text-[10px] font-bold px-2 py-1 rounded-lg bg-slate-900 border border-slate-700 text-slate-400">⏱️ ${ex.rest}</span>
              </div>
              
              <div class="text-[11px] font-medium text-brand-textMuted leading-relaxed bg-slate-900/40 p-2.5 rounded-xl border border-slate-700/50">
                💡 ${ex.note}
              </div>
            </div>
          </div>
          
          <div class="grid grid-cols-12 gap-3 mt-4 pt-4 border-t border-slate-700/50">
            <div class="col-span-4 flex flex-col gap-1.5">
              <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Weight</label>
              <input type="text" id="wt-${ex.id}" placeholder="${ex.defaultWeight}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-white focus:outline-none focus:border-brand-accent transition-colors">
            </div>
            <div class="col-span-4 flex flex-col gap-1.5">
              <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Reps</label>
              <input type="text" id="rep-${ex.id}" placeholder="${ex.defaultReps}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-white focus:outline-none focus:border-brand-accent transition-colors">
            </div>
            <div class="col-span-4 flex flex-col gap-1.5">
              <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Notes</label>
              <input type="text" id="nt-${ex.id}" placeholder="e.g. Hard" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-white focus:outline-none focus:border-brand-accent transition-colors">
            </div>
          </div>
        </div>
      `}).join('');
    }

    function toggleCheck(id, isExamFocus) {
      const chk = document.getElementById(`chk-${id}`);
      const card = document.getElementById(`card-${id}`);
      const title = document.getElementById(`title-${id}`);
      
      if (chk.checked) {
        card.classList.add('bg-brand-success/10', 'border-brand-success/40');
        card.classList.remove('exam-highlight', 'border-brand-border/60');
        title.classList.add('line-through', 'text-brand-textMuted');
        title.classList.remove('text-white');
      } else {
        card.classList.remove('bg-brand-success/10', 'border-brand-success/40');
        title.classList.remove('line-through', 'text-brand-textMuted');
        title.classList.add('text-white');
        
        if(isExamFocus) {
           card.classList.add('exam-highlight');
        } else {
           card.classList.add('border-brand-border/60');
        }
      }
    }

    function saveTodayRecord() {
      const dayData = workoutSchedule[currentDay];
      const now = new Date();
      const dateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const itemsRecorded = [];
      let completedCount = 0;

      dayData.exercises.forEach(ex => {
        const isDone = document.getElementById(`chk-${ex.id}`).checked;
        const weight = document.getElementById(`wt-${ex.id}`).value.trim();
        const reps = document.getElementById(`rep-${ex.id}`).value.trim();
        const note = document.getElementById(`nt-${ex.id}`).value.trim();

        if (isDone) completedCount++;

        itemsRecorded.push({
          name: ex.name,
          done: isDone,
          weight: weight || ex.defaultWeight,
          reps: reps || ex.defaultReps,
          note: note,
          isExam: ex.tags && ex.tags.includes('PI-Exam')
        });
      });

      const newLog = {
        id: 'log_' + Date.now(),
        date: dateString,
        time: timeString,
        dayNum: currentDay,
        title: dayData.title,
        completedCount: completedCount,
        totalItems: dayData.exercises.length,
        items: itemsRecorded
      };

      currentLogs.unshift(newLog);
      localStorage.setItem('pi_workout_logs_v2', JSON.stringify(currentLogs));

      updateTotalStats();
      showToast(`Saved: ${completedCount}/${dayData.exercises.length} Exercises`);
      
      setTimeout(() => { switchTab('history'); }, 600);
    }

    function updateTotalStats() {
      document.getElementById('totalLogsCount').innerText = currentLogs.length;
    }

    function renderHistoryLogs() {
      const container = document.getElementById('historyLogsContainer');
      if (!currentLogs || currentLogs.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 glass-panel rounded-3xl border border-dashed border-slate-700">
            <div class="text-4xl mb-3 opacity-50">📭</div>
            <p class="font-bold text-sm">No Logs Yet</p>
            <p class="text-xs mt-1">Save a workout to see history here.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = currentLogs.map(log => {
        const rate = Math.round((log.completedCount / log.totalItems) * 100);
        let rateColor = rate === 100 ? 'text-brand-success' : (rate > 50 ? 'text-brand-accent' : 'text-slate-400');
        
        return `
        <div class="glass-panel rounded-3xl p-5 border border-brand-border/50" id="${log.id}">
          <div class="flex justify-between items-start mb-4 border-b border-slate-700/50 pb-3">
            <div>
              <div class="text-sm font-black text-white tracking-wide">${log.date} <span class="text-brand-textMuted text-[10px] font-bold ml-1">${log.time}</span></div>
              <div class="text-[11px] font-bold text-brand-accent mt-0.5">${log.title}</div>
            </div>
            <div class="text-right">
              <div class="text-[11px] font-black ${rateColor} bg-slate-900 px-2 py-1 rounded-lg">Score: ${rate}%</div>
              <button onclick="requestDelete('${log.id}')" class="text-[10px] text-brand-exam font-bold mt-2 hover:underline">Delete Log</button>
            </div>
          </div>
          
          <div class="flex flex-col gap-2">
            ${log.items.map(it => `
              <div class="flex justify-between items-start text-xs">
                <div class="flex-1 pr-2 ${it.done ? 'text-slate-200 font-bold' : 'text-slate-500 line-through font-medium'}">
                  ${it.done ? '<span class="text-brand-success mr-1">✓</span>' : '<span class="text-slate-600 mr-1">○</span>'} 
                  ${it.name} 
                  ${it.isExam ? '<span class="text-white bg-brand-exam ml-1 text-[8px] font-black px-1 rounded uppercase">PI</span>' : ''}
                </div>
                <div class="text-brand-accent font-bold text-right shrink-0 bg-slate-900 px-2 py-0.5 rounded flex flex-col items-end">
                  <span>${it.weight !== '-' ? it.weight + ' x ' : ''}${it.reps}</span>
                  ${it.note ? `<span class="text-[9px] text-slate-400 font-medium">Note: ${it.note}</span>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `}).join('');
    }

    // Custom Modal Logic (Replacing alert/confirm)
    function showConfirm(title, message, callback) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = message;
      modalCallback = callback;
      document.getElementById('confirmModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('active');
      modalCallback = null;
    }

    document.getElementById('modalConfirmBtn').addEventListener('click', () => {
      if (modalCallback) modalCallback();
      closeModal();
    });

    function requestClearForm() {
      showConfirm("Clear Inputs", "Are you sure you want to clear all checkboxes and inputs for today?", () => {
        renderDayPlan(currentDay);
      });
    }

    function requestDelete(logId) {
      showConfirm("Delete Log", "This action cannot be undone. Are you sure?", () => {
        currentLogs = currentLogs.filter(l => l.id !== logId);
        localStorage.setItem('pi_workout_logs_v2', JSON.stringify(currentLogs));
        updateTotalStats();
        renderHistoryLogs();
      });
    }

    function startTimer(seconds) {
      stopTimer();
      remainingSeconds = seconds;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSeconds--;
        if (remainingSeconds <= 0) {
          stopTimer();
          showToast('🔔 Rest Over! Go!');
          if (navigator.vibrate) navigator.vibrate([200, 100, 300]);
        }
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      remainingSeconds = 0;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const display = document.getElementById('timerDisplay');
      const m = Math.floor(remainingSeconds / 60);
      const s = remainingSeconds % 60;
      display.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      
      if (remainingSeconds > 0 && remainingSeconds <= 10) {
        display.classList.replace('text-brand-success', 'text-brand-exam');
      } else {
        display.classList.replace('text-brand-exam', 'text-brand-success');
      }
    }

    function loadHabits() {
      const today = new Date().toISOString().split('T')[0];
      if (dailyHabits.date !== today) {
        dailyHabits = { date: today, creatine: false, water: false };
        localStorage.setItem('pi_daily_habits_v2', JSON.stringify(dailyHabits));
      }
      document.getElementById('chkCreatine').checked = dailyHabits.creatine;
      document.getElementById('chkWater').checked = dailyHabits.water;
    }

    function saveHabits() {
      dailyHabits.creatine = document.getElementById('chkCreatine').checked;
      dailyHabits.water = document.getElementById('chkWater').checked;
      localStorage.setItem('pi_daily_habits_v2', JSON.stringify(dailyHabits));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentLogs, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `PI_Tracker_Backup_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function triggerImport() { document.getElementById('importFileInput').click(); }
    
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            currentLogs = imported;
            localStorage.setItem('pi_workout_logs_v2', JSON.stringify(currentLogs));
            updateTotalStats();
            renderHistoryLogs();
            showToast('✅ Data Imported Successfully!');
          }
        } catch (err) { 
          // Replaced alert with modal
          showConfirm("Error", "Import failed. Invalid file format.", () => {});
        }
      };
      reader.readAsText(file);
    }

    window.onload = initApp;
  </script>
</body>
</html>
